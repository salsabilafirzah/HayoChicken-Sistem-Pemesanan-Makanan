name: hayochicken_mobile
description: "Aplikasi Mobile Hayo Chicken - Tier 1"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.1
  flutter_riverpod: ^2.4.10
  shared_preferences: ^2.2.2
  go_router: ^13.2.0
  intl: ^0.19.0
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.1.2
  google_fonts: ^6.1.0
  gal: ^2.3.2
  path_provider: ^2.1.2
  flutter_slidable: ^4.0.3
  share_plus: ^12.0.2
  pdf: ^3.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#9B1A1A"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/images/
